# Read by U-Boot sysboot from the FAT boot partition.
# No serial console by default: printk to an unattended 115200 UART stalled
# boot by ~0.9s. `quiet` keeps fbcon from rendering every message; the full
# log is still in dmesg (the frontend saves it to the GBA partition). For a
# UART add console=ttyS2,115200 and drop quiet.
default rg351p
prompt 0
timeout 0

label rg351p
	kernel /Image
	fdt /rk3326-anbernic-rg351p.dtb
	append root=/dev/mmcblk0p2 rootfstype=ext4 ro rootwait quiet console=tty0 fbcon=rotate:3 consoleblank=0 printk.time=1
