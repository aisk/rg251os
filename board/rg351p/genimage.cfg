# SD card layout for the RG351P (MBR):
#   32KiB (sector 64)  bootloader.bin, raw, outside the partition table
#                      (legacy: up to 16MiB, mainline: up to ~8.7MiB)
#   16MiB              p1 FAT  BOOT   Image, dtb, boot.ini, extlinux/extlinux.conf
#   after p1           p2 ext4 rootfs (mounted read-only)
#   after p2           p3 FAT  GBA    ROMs and saves

image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"Image",
			"rk3326-anbernic-rg351p.dtb",
			"boot.ini",
			"extlinux"
		}
	}
	size = 32M
}

image data.vfat {
	vfat {
		label = "GBA"
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition u-boot {
		in-partition-table = "no"
		image = "bootloader.bin"
		offset = 32K
	}

	partition boot {
		partition-type = 0x0c
		bootable = "true"
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x0c
		image = "data.vfat"
	}
}
