odroidgoa-uboot-config

# Run by the legacy U-Boot (cfgload) from the first FAT partition of the SD
# card, which is mmc 1 there. The first line above is a required magic.
# Hand over to the same extlinux.conf mainline U-Boot uses. Legacy U-Boot
# has no kernel_addr_r; 0x09000000 keeps the kernel clear of the dtb at
# 0x01f00000 and of U-Boot itself, as in ROCKNIX.
setenv kernel_addr_r "0x09000000"
setenv fdt_addr_r "0x01f00000"
sysboot mmc 1:1 any 0x100000 /extlinux/extlinux.conf
